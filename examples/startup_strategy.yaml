# ORE Example: Startup Strategy
# Use intellectual pressure to stress-test a go-to-market strategy.

question: >
  A marketplace startup connecting independent vintage clothing sellers with
  curated buyers is preparing to scale beyond its first 50 sellers. What is the
  optimal go-to-market strategy? Should they prioritize supply-side growth
  (more sellers), demand-side growth (more buyers), or vertical integration
  (tools and services for existing sellers)? What are the second-order effects
  of each choice?

max_rounds: 6
budget_usd: 3.00

agents:
  builder:
    model: "openai/gpt-4o"
    temperature: 0.7
    max_tokens: 4096
  skeptic:
    model: "openai/gpt-4o"
    temperature: 0.2
    max_tokens: 4096
  historian:
    model: "openai/gpt-4o-mini"
    temperature: 0.5
    max_tokens: 3000
  referee:
    model: "openai/gpt-4o-mini"
    temperature: 0.1
    max_tokens: 2000
